[project]
name = "moleculeradar"
version = "0.1.0"
description = "Molecule Radar - pharmaceutical opportunity intelligence (Llama Labs)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "typer>=0.15",
    "rich>=13.9",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.10",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
    "structlog>=24.4",
    "slowapi>=0.1.9",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.22",
    "pip-audit>=2.7",
]

[project.scripts]
moleculeradar = "moleculeradar.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moleculeradar"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ARG", "PTH", "RUF"]
ignore = ["B008", "N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires a live Postgres database",
    "live_network: requires outbound internet egress (skipped by default)",
]
filterwarnings = ["error::DeprecationWarning:moleculeradar.*"]

[tool.mypy]
python_version = "3.11"
plugins = []
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# Signal evaluators share one uniform signature so they can be held in a registry
# and invoked generically; not every signal needs the shared context argument.
"src/moleculeradar/signals/definitions.py" = ["ARG001"]
# Pharmaceutical source data genuinely contains typographic apostrophes and
# dashes ("Dr. Reddy's" with U+2019). Testing that we normalise them requires
# writing them literally.
"tests/unit/test_normalize.py" = ["RUF001"]
"src/moleculeradar/core/config.py" = ["RUF001", "RUF002"]
# This module exists to fold typographic characters to ASCII, so it must
# contain them literally.
"src/moleculeradar/resolution/normalize.py" = ["RUF001", "RUF002"]
"tests/integration/test_entity_resolution.py" = ["RUF001"]
